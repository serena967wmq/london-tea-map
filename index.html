#top{padding:12px 16px 8px;border-bottom:1px solid var(--line)}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:13px;color:var(--ink2)}
.row b{font-weight:600;color:var(--ink);min-width:56px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:3px 10px;cursor:pointer;font-size:13px;color:var(--ink)}
.chip.off{background:#f0efec;color:var(--muted);text-decoration:line-through}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.note{font-size:12px;color:var(--muted)}
#map{height:66vh;min-height:360px}
#cl{padding:12px 16px 24px;font-size:13px;color:var(--ink2)}
#cl h2{font-size:16px;color:var(--ink);margin:0 0 6px}
#cl table{border-collapse:collapse;width:100%}
#cl td,#cl th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.mk{display:block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function icon(t,col,ring){const sz=14; let st='width:'+sz+'px;height:'+sz+'px;background:'+(ring?'#fff':col)+';'+(ring?'box-shadow:0 0 0 3px '+col+';':'');
 if(t==='纯茶·茶馆') st+='border-radius:2px;'; else if(t==='茶叶店') st+='transform:rotate(45deg);border-radius:1px;'; else st+='border-radius:50%;';
 return L.divIcon({className:'',html:'<i class="mk" style="'+st+'"></i>',iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]});}
function pop(p){let st=p.k==='open'?Z('在册；估算登记年份 ','On the register; estimated registration year ')+esc(p.y0):p.k==='span'?Z('已关的店：开 ','Closed: opened ')+esc(p.y0)+Z('，关 ',', closed ')+esc(p.yc0)+Z('（≤ 表示最晚那年已在／已关）',' (≤ = by that year at the latest)'):Z('将来要开；申请/预告 ','Planned; application or announcement ')+esc(p.y0);
 const showN=x=>x&&!(LANG==='en'&&hasZh(x)); return '<b>'+esc(p.n)+'</b>'+(p.b?'<br>'+Z('品牌：','Brand: ')+esc(p.b):'')+'<br>'+Z('类型：','Type: ')+esc(tv(TY,p.t))+Z('　来自：',' · Origin: ')+esc(tv(OR,p.o))+(showN(p.os)?' <span style="color:#8a8985">('+esc(p.os).slice(0,120)+')</span>':'')+'<br>'+esc(p.a)+'<br>'+st+(showN(p.s)?'<br><span style="color:#8a8985">'+esc(p.s)+'</span>':'')+(p.u?'<br><a href="'+esc(p.u)+'" target="_blank" rel="noopener">'+Z('出处','Source')+'</a>':'');}
const vis=p=>!offT.has(p.t)&&!offO.has(p.o);
function chips(){const cnt=(f,v)=>P.filter(p=>p.k==='open'&&p[f]===v).length;
 for(const [id,list,f,off] of [['ftype',TYPES,'t',offT],['forig',ORIGS,'o',offO]]){const el=document.getElementById(id); el.querySelectorAll('.chip').forEach(c=>c.remove());
  for(const v of list){const n=cnt(f,v); if(!n) continue; const b=document.createElement('span'); b.className='chip'+(off.has(v)?' off':''); b.textContent=tv(f==='t'?TY:OR,v)+' '+n;
   b.onclick=()=>{off.has(v)?off.delete(v):off.add(v); chips(); draw();}; el.appendChild(b);} } }
function draw(){const Y=+s.value; const fut=Y===2027; const y=fut?2026:Y;
 document.getElementById('yr').textContent=fut?Z('现在 + 将来','Now + future'):(Y===2012?Z('2012 及以前','2012 or earlier'):Y+Z(' 年',''));
 layer.clearLayers(); let n=0,nw=0,ncl=0,nf=0;
 for(const p of P){ if(!vis(p)) continue; let col=null,ring=false;
  if(p.k==='open'){ if((p.y===null&&y>=2026)||(p.y!==null&&p.y<=y)){ col=(p.y===y&&!fut)?'--orange':'--blue'; n++; if(col==='--orange')nw++; } }
  else if(p.k==='span'){ if(!fut&&p.y<=y&&y<p.yc){ col=(p.y===y)?'--orange':'--blue'; n++; if(p.y===y)nw++; } if(!fut&&p.yc===y) ncl++; }
  else if(p.k==='future'){ if(fut){ring=true;nf++;} }
  if(!col&&!ring) continue;
  L.marker([p.lat,p.lon],{icon:icon(p.t,css(ring?'--aqua':col),ring)}).bindPopup(pop(p)).addTo(layer);}
 document.getElementById('stat').textContent=LANG==='en'?('Showing: '+n+' open'+(fut?', '+nf+' planned':', '+nw+' new this year, '+ncl+' closed this year (only where the closing year is known)')):('当前显示：在营 '+n+' 家'+(fut?'，将来要开 '+nf+' 处':'，这一年新出现 '+nw+' 家，这一年关掉 '+ncl+' 家（只算查得到关店年份的）'));}
const s=document.getElementById('s'); s.addEventListener('input',draw);
document.getElementById('ct').onclick=()=>map.setView([51.5113,-0.1311],16);
document.getElementById('ld').onclick=()=>map.setView([51.507,-0.12],11);
let t=null; document.getElementById('play').onclick=function(){ if(t){clearInterval(t);t=null;this.textContent=Z('▶ 播放','▶ Play');return;} s.value=2012; draw(); this.textContent=Z('⏸ 暂停','⏸ Pause');
 t=setInterval(()=>{ if(+s.value>=2027){clearInterval(t);t=null;document.getElementById('play').textContent=Z('▶ 播放','▶ Play');return;} s.value=+s.value+1; draw(); },1200); };
function closedTable(){const el=document.getElementById('cl'); if(!CL.length){el.innerHTML='';return;}
 let h=LANG==='en'?('<h2>Closed places with unknown or unreliable years ('+CL.length+')</h2><p class="note">There is evidence these places closed, but the opening and closing years are unknown, or only company registration and dissolution dates exist (registration is not opening; dissolution is not closing). They are not on the time bar.</p><table><tr><th>Place</th><th>Address</th><th>How we know it closed</th><th>Years</th></tr>'):('<h2>已关、年份查不到或不可靠的店（'+CL.length+' 家）</h2><p class="note">这些店有关店的依据，但开、关年份查不到，或者只有公司注册、注销日期（注册≠开业，注销≠关店），可信度低，所以不放在时间条上。</p><table><tr><th>店名</th><th>地址</th><th>怎么知道关了</th><th>年份</th></tr>');const ne=x=>(LANG==='en'&&hasZh(x))?'':esc(x);
 for(const c of CL){ h+='<tr><td>'+esc(c.n)+'</td><td>'+esc(c.a)+'</td><td>'+ne(c.ev)+(c.u?' <a href="'+esc(c.u)+'" target="_blank" rel="noopener">'+Z('出处','Source')+'</a>':'')+'</td><td>'+(ne([c.yo,c.yc].filter(Boolean).join('; '))||Z('年份查不到','years unknown'))+((c.cf&&!(LANG==='en'&&hasZh(c.cf)))?'<br><span class="note">'+Z('可信度：','Confidence: ')+esc(c.cf)+'</span>':'')+'</td></tr>'; }
 el.innerHTML=h+'</table>';}
document.getElementById('lang').onclick=()=>{LANG=LANG==='en'?'zh':'en';applyLang();};
applyLang();
</script></body></html>
